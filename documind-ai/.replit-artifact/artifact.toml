kind = "mobile"
previewPath = "/"
title = "DocuMind AI"
description = "A professional mobile document intelligence workspace for reviewing, extracting, comparing, and understanding important documents with confidence."
version = "1.0.0"
id = "artifacts/documind-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21716

[services.development]
run = "pnpm --filter @workspace/documind-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/documind-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/documind-mobile", "run", "serve" ]

[services.env]
PORT = "21716"
BASE_PATH = "/"
